# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: System deps for systemd-python
      run: sudo apt-get update && sudo apt-get install -y libsystemd-dev pkg-config
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bareexporter .
      - name: Run container
        run: | 
          docker run -d --name app \
          -p 9436:9436 \
          -e REDFISH_BASE_URL=http://127.0.0.1:1 \
          -e REDFISH_USER=ci \
          -e REDFISH_PASSWORD=ci \
          bareexporter
      - name: Get current user from container
        run: docker exec app id
      - name: Smoke-test
        run: |
          sleep 5
          curl -sf localhost:9436/metrics | grep '^redfish_up'
      - name: SIGTERM
        run: |
          time docker stop app
      - name: Container logs
        if: always()
        run: docker logs app